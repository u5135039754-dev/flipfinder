# flipFinder settings

domain: www.vinted.it        # or www.vinted.fr, www.vinted.de, ...
interval_minutes: 5          # only used when running on your PC (python main.py)
request_delay: 2             # seconds between Vinted requests, don't go lower
comparable_pages: 3          # pages of listings used to work out market value
pool_refresh_minutes: 180    # how often market value gets recalculated (also eBay/Subito: 3 h)
stagger: true                # budget and guitar/amp/pedal searches take turns: each every 10 min

# eBay.it (official Browse API), on when EBAY_CLIENT_ID / EBAY_CLIENT_SECRET are set.
# The API allows 5,000 calls a day. Each eBay pass costs one call per search, and each
# pool refresh another: 38 searches every 20 min + pools every 3 h = ~3,050 calls a day.
ebay:
  item_location: IT          # IT, or EU for items anywhere in the EU that ship to Italy
  interval_minutes: 20
  pool_refresh_minutes: 180

# Subito.it, local pickup only: new listings in the province, kept if the town is within
# radius_km of center. Market value uses Italy-wide Subito listings plus Vinted and eBay.
subito:
  enabled: true
  # the home area (region, province, center, radius, travel costs) is private: it lives in the
  # Worker's storage and each run reads it from there
  pool_refresh_minutes: 180

# Budget mode (searches with `budget: true`): what you can spend per item, all in
budget: 72
budget_rules:
  min_profit: 12
  min_roi: 35
  max_roi: 150               # far cheaper than this is usually a fake or broken

# Vinted adds a buyer protection fee on top of the price.
# If the API gives the real total we use that, otherwise this estimate.
buyer_protection:
  fixed: 0.70
  percent: 5

rules:
  min_profit: 25       # € you'd make at least (gear is pricier, so higher than for clothes)
  min_roi: 30          # % profit compared to what you pay
  min_rating: 5        # out of 10 (6 blocked cheap items: full profit points need €50+)
  min_comparables: 8   # need this many similar listings to trust the market value
  max_roi: 120         # way cheaper than this usually means a different model, fake, broken or a toy
  resell_costs: 10     # your packaging when you resell (the buyer pays shipping on Vinted)
  shipping_cost: 15    # what you pay for delivery, only used when the item page doesn't say
                       # (searches below override both per item type)

# Titles containing any of these get skipped, for every search
exclude_keywords:
  # fakes and broken stuff
  - fake
  - replica
  - copia
  - rotto
  - rotta
  - difettoso
  - guasto
  - guasta
  - non funzionante
  - per ricambi
  # toys and kids' stuff
  - giocattolo
  - toy
  - bambini
  - bambino
  # merch, not gear
  - maglietta
  - t-shirt
  - felpa
  - cappello
  - poster
  - adesivo
  - sticker
  - portachiavi
  - tazza
  # parts and accessories only
  - solo custodia
  - solo case
  - battipenna
  - pickguard
  - manico
  - meccaniche
  - corde
  - plettri
  - tracolla
  # bundles get compared to the single item otherwise (smaller "mini" versions are
  # matched as their own model instead)
  - kit
  - set
  - pack
  - starter
  - bundle

# price_from cuts out cheap accessories that share the keyword
searches:
  # One model per search: market value is the median of the search, so mixing
  # cheap and premium models makes every cheap one look like a deal.

  # Strats
  - query: fender player stratocaster
    price_from: 350
    price_to: 600
    shipping_cost: 22
    resell_costs: 10
  - query: squier classic vibe stratocaster
    price_from: 150
    price_to: 300
    shipping_cost: 22
    resell_costs: 10
  - query: squier affinity stratocaster
    price_from: 60
    price_to: 200
    shipping_cost: 22
    resell_costs: 10

  # Les Pauls
