    price_from: 500
    price_to: 1500
    exclude_keywords: [epiphone, tribute copy, made in china, copy]
    shipping_cost: 22
    resell_costs: 10

  # Acoustics
  - query: yamaha chitarra
    price_from: 40
    price_to: 200
