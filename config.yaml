# flipFinder settings

domain: www.vinted.it        # or www.vinted.fr, www.vinted.de, ...
interval_minutes: 5          # only used when running on your PC (python main.py)
request_delay: 2             # seconds between Vinted requests, don't go lower
comparable_pages: 3          # pages of listings used to work out market value
pool_refresh_minutes: 60     # how often market value gets recalculated

# Vinted adds a buyer protection fee on top of the price.
# If the API gives the real total we use that, otherwise this estimate.
buyer_protection:
  fixed: 0.70
  percent: 5

rules:
  min_profit: 25       # € you'd make at least (gear is pricier, so higher than for clothes)
  min_roi: 30          # % profit compared to what you pay
  min_rating: 5        # out of 10 (6 blocked cheap items: full profit points need €50+)
  min_comparables: 8   # need this many similar listings to trust the market value
  max_roi: 120         # way cheaper than this usually means a different model, fake, broken or a toy
  resell_costs: 10     # your packaging when you resell (the buyer pays shipping on Vinted)
  shipping_cost: 15    # what you pay for delivery, only used when the item page doesn't say
                       # (searches below override both per item type)

# Titles containing any of these get skipped, for every search
exclude_keywords:
  # fakes and broken stuff
  - fake
  - replica
  - copia
  - rotto
  - rotta
  - difettoso
  - non funzionante
  - per ricambi
  # toys and kids' stuff
  - giocattolo
  - toy
  - bambini
  - bambino
  # merch, not gear
  - maglietta
  - t-shirt
  - felpa
  - cappello
  - poster
  - adesivo
  - sticker
  - portachiavi
  - tazza
  # parts and accessories only
  - solo custodia
  - solo case
  - battipenna
  - pickguard
  - manico
  - meccaniche
  - corde
  - plettri
  - tracolla
  # bundles get compared to the single item otherwise (smaller "mini" versions are
  # matched as their own model instead)
  - kit
  - set
  - pack
  - starter
  - bundle

# price_from cuts out cheap accessories that share the keyword
searches:
  # One model per search: market value is the median of the search, so mixing
  # cheap and premium models makes every cheap one look like a deal.

  # Strats
  - query: fender player stratocaster
    price_from: 350
    price_to: 600
    shipping_cost: 22
    resell_costs: 10
  - query: squier classic vibe stratocaster
    price_from: 150
    price_to: 300
    shipping_cost: 22
    resell_costs: 10
  - query: squier affinity stratocaster
    price_from: 60
    price_to: 200
    shipping_cost: 22
    resell_costs: 10

  # Les Pauls
  - query: epiphone les paul standard
    price_from: 150
    price_to: 350
    shipping_cost: 22
    resell_costs: 10
  - query: epiphone les paul special
    price_from: 60
    price_to: 200
    shipping_cost: 22
    resell_costs: 10
  - query: gibson les paul studio
    price_from: 500
    price_to: 1500
    exclude_keywords: [epiphone, tribute copy, made in china, copy]
    shipping_cost: 22
    resell_costs: 10

  # Acoustics
  - query: yamaha chitarra
    price_from: 40
    price_to: 200
    shipping_cost: 20
    resell_costs: 12
  - query: fender acustica
    price_from: 40
    price_to: 200
    shipping_cost: 20
    resell_costs: 12
  - query: takamine
    price_from: 150       # cheaper ones are entry G-series, valued against pro models otherwise
    price_to: 300
    shipping_cost: 20
    resell_costs: 12

  # Amps (Marshall also sells headphones/speakers, so those get skipped)
  - query: boss katana
    price_from: 80
    price_to: 300
    exclude_keywords: [pedale, footswitch]
    shipping_cost: 10
    resell_costs: 5
  - query: fender mustang amplificatore
    price_from: 40
    price_to: 200
    shipping_cost: 10
    resell_costs: 5
  - query: marshall amplificatore
    price_from: 70        # skips MG10-size practice amps
    price_to: 300
    exclude_keywords: [cuffie, headphones, bluetooth, speaker, cassa, emberton, major, minor, acton, stanmore, woburn]
    shipping_cost: 10
    resell_costs: 5
  - query: vox amplificatore
    price_from: 40
    price_to: 300
    shipping_cost: 10
    resell_costs: 5

  # Pedals
  - query: boss
    price_from: 25
    price_to: 90
    filters:
      catalog: [4840]      # Vinted's "Pedali" category, otherwise "boss" is mostly Hugo Boss clothes
    exclude_keywords: [katana]   # the Katana search covers those
    shipping_cost: 6
    resell_costs: 1

  # Soundbars
  - query: soundbar sony    # every Sony soundbar, each compared with the same model (HT-G700 with HT-G700s)
    price_from: 80
    price_to: 250
    exclude_keywords: [telecomando, remote, staffa, supporto, cavo]
    shipping_cost: 9
    resell_costs: 4
  - query: sony g700        # catches G700 listings that don't say "soundbar"
    price_from: 80
    price_to: 250
    exclude_keywords: [telecomando, remote, staffa, supporto, cavo]
    shipping_cost: 9
    resell_costs: 4

  # ---------------------------------------------------------------------------
  # Electronics. Each search is limited to Vinted's category for the device, which
  # already drops most cases, cables and chargers sold on their own. Storage, chip,
  # size and suffixes (Pro/Max/Plus/Ti/OLED...) must match exactly to compare.
  # Price ranges from live vinted.it listings (Oct 2026): floor ~ cheapest real
  # devices, ceiling ~ median, so a deal has room under the market.

  # Phones (category 3661, "Telefoni cellulari")
  - query: iphone 12
    price_from: 90
    price_to: 180
    filters: {catalog: [3661]}
    # "solo ..." = the accessory on its own; "iPhone con custodia e caricatore" still counts,
    # and price_from keeps cheap accessory listings out
    exclude_keywords: &electronics [solo custodia, solo cover, solo caricatore, solo cavo, case only,
                                    scatola vuota, box only, pellicola, icloud, bloccato, account, per pezzi, ricambi, schermo rotto,
                                    display rotto, non funziona, replica, copia, aaa, "1:1",
                                    # the same in the other languages vinted.it shows
                                    "ne s'allume", ne fonctionne, en panne, hs, défectueux, bloqué, pièces,
                                    no funciona, no enciende, averiado, bloqueado, bloqueada, piezas,
                                    não funciona, defekt, kaputt, gesperrt, kapot, broken, not working,
                                    locked, for parts]
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 12 pro
    price_from: 120
    price_to: 240
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 13
    price_from: 140
    price_to: 250
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 13 pro
    price_from: 200
    price_to: 320
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 14
    price_from: 180
    price_to: 300
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 14 pro
    price_from: 260
    price_to: 420
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 15
    price_from: 260
    price_to: 450
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2
  - query: iphone 15 pro
    price_from: 350
    price_to: 550
    filters: {catalog: [3661]}
    exclude_keywords: *electronics
    max_roi: 60            # far below market is usually iCloud-locked or a scam
    shipping_cost: 5
    resell_costs: 2

  # AirPods (category 3678). Fakes are everywhere: below this floor almost all are
  # copies, and anything "too cheap" is more likely fake than a deal, hence max_roi 50.
  - query: airpods pro 2
    price_from: 70
    price_to: 140
    filters: {catalog: [3678]}
    exclude_keywords: *electronics
    max_roi: 50
    shipping_cost: 4
    resell_costs: 2

  # Apple Watch (category 3035, "Smartwatch")
  - query: apple watch series 7
    price_from: 60
    price_to: 130
    filters: {catalog: [3035]}
    exclude_keywords: [*electronics, cinturino]
    shipping_cost: 4
    resell_costs: 2
  - query: apple watch series 8
    price_from: 80
    price_to: 170
    filters: {catalog: [3035]}
    exclude_keywords: [*electronics, cinturino]
    shipping_cost: 4
    resell_costs: 2
  - query: apple watch series 9
    price_from: 120
    price_to: 220
    filters: {catalog: [3035]}
    exclude_keywords: [*electronics, cinturino]
    shipping_cost: 4
    resell_costs: 2
  - query: apple watch se
    price_from: 60
    price_to: 130
    filters: {catalog: [3035]}
    exclude_keywords: [*electronics, cinturino]
    shipping_cost: 4
    resell_costs: 2

  # iPad (category 3728, "Tablet")
  - query: ipad 9
    price_from: 100
    price_to: 200
    filters: {catalog: [3728]}
    exclude_keywords: [*electronics, pro, air]
    shipping_cost: 6
    resell_costs: 2
  - query: ipad 10
    price_from: 160
    price_to: 300
    filters: {catalog: [3728]}
    exclude_keywords: [*electronics, pro, air]
    shipping_cost: 6
    resell_costs: 2

  # MacBook (category 3580, "Computer portatili")
  - query: macbook air m1
    price_from: 300
    price_to: 500
    filters: {catalog: [3580]}
    exclude_keywords: *electronics
    shipping_cost: 7
    resell_costs: 2
  - query: macbook air m2
    price_from: 450
    price_to: 700
    filters: {catalog: [3580]}
    exclude_keywords: *electronics
    shipping_cost: 7
    resell_costs: 2

  # Graphics cards (category 3602). MSI, ASUS, Gigabyte... sell the same chip, so
  # compare across brands; VRAM and Ti/Super still have to match.
  - query: rtx 3060
    price_from: 160
    price_to: 280
    filters: {catalog: [3602]}
    exclude_keywords: *electronics
    match_brand: false
    shipping_cost: 7
    resell_costs: 2
  - query: rtx 3070
    price_from: 200
    price_to: 330
    filters: {catalog: [3602]}
    exclude_keywords: *electronics
    match_brand: false
    shipping_cost: 7
    resell_costs: 2
  - query: rtx 4060
    price_from: 200
    price_to: 320
    filters: {catalog: [3602]}
    exclude_keywords: *electronics
    match_brand: false
    shipping_cost: 7
    resell_costs: 2

  # Consoles (category 3025, "Console")
  - query: ps5
    price_from: 200
    price_to: 400
    filters: {catalog: [3025]}
    exclude_keywords: [*electronics, portal, portable, portátil, portatil]   # PlayStation Portal is a different device
    shipping_cost: 10      # bigger and heavier than the €3-7 small parcels
    resell_costs: 2
  - query: nintendo switch oled
    price_from: 120
    price_to: 230
    filters: {catalog: [3025]}
    exclude_keywords: *electronics
    shipping_cost: 7
    resell_costs: 2
