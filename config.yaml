    shipping_cost: 20
    resell_costs: 12
  - query: takamine
    price_from: 150       # cheaper ones are entry G-series, valued against pro models otherwise
    price_to: 300
    shipping_cost: 20
    resell_costs: 12

  # Amps (Marshall also sells headphones/speakers, so those get skipped)
  - query: boss katana
    price_from: 80
