# Runs flipFinder in the cloud on a schedule, so it works with your PC off.
name: flipFinder

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min, the shortest GitHub allows (it may delay runs when busy)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

concurrency:
  group: flipfinder
  cancel-in-progress: false

permissions:
  contents: write   # to commit settings.json changed from Telegram

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal runs take ~3 min; the first run after adding many searches longer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Brings back seen items + price pools from the previous run
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}
          restore-keys: flipfinder-data-

      - name: Scan Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python main.py --once

      # Settings changed from Telegram are committed back so they survive
      - name: Save Telegram settings
        if: always()
        run: |
          if [ -f settings.json ] && [ -n "$(git status --porcelain settings.json)" ]; then
            git config user.name "flipfinder-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add settings.json
            git commit -m "Update settings from Telegram"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}
