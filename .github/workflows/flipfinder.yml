# Runs flipFinder in the cloud on a schedule, so it works with your PC off.
name: flipFinder

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min, the shortest GitHub allows (it may delay runs when busy)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

concurrency:
  group: flipfinder
  cancel-in-progress: false

permissions:
  contents: read    # nothing is committed: settings and deals live in the Worker's private storage

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal runs take ~3 min; the first run after adding many searches longer
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # healthchecks.io ping address (optional)
    steps:
      # healthchecks.io: "started" now, success or failure at the end; no ping for 35 min = alert
      - name: Health check start
        run: '[ -z "$HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/start" || true'

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Brings back seen items + price pools from the previous run
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}
          restore-keys: flipfinder-data-

      # Settings, the home area and deal tracking come from the Cloudflare Worker, which also
      # sends every Telegram message
      - name: Scan
        env:
          FLIPFINDER_API_URL: ${{ secrets.FLIPFINDER_API_URL }}
          FLIPFINDER_API_KEY: ${{ secrets.FLIPFINDER_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python main.py --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}

      # runs even when an earlier step failed (pip install, the scan...) or the job timed out
      - name: Health check result
        if: always()
        run: |
          [ -z "$HEALTHCHECK_URL" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || true
