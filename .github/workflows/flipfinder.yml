# Runs flipFinder in the cloud on a schedule, so it works with your PC off.
name: flipFinder

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min, the shortest GitHub allows (it may delay runs when busy)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

concurrency:
  group: flipfinder
  cancel-in-progress: false

permissions:
  contents: write   # to commit settings.json changed from Telegram

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal runs take ~3 min; the first run after adding many searches longer
    steps:
      # the newest main, not the commit the run was triggered on: the previous run may have
      # just committed settings.json / deals.json
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Brings back seen items + price pools from the previous run
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}
          restore-keys: flipfinder-data-

      - name: Scan Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python main.py --once

      # Settings and deal tracking changed from Telegram are committed back so they survive
      - name: Save Telegram settings and deals
        if: always()
        run: |
          if [ -n "$(git status --porcelain settings.json deals.json 2>/dev/null)" ]; then
            git config user.name "flipfinder-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in settings.json deals.json; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Update settings/deals from Telegram"
            # if main moved meanwhile, keep this run's settings/deals ("theirs" = the commit replayed)
            git pull --rebase -X theirs origin main && git push origin HEAD:main
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: flipfinder-data-${{ github.run_id }}
