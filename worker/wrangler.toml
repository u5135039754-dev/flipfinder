name = "flipfinder"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The Mini App's page (public/app/index.html, served at /app/); its API is in the Worker
[assets]
directory = "./public"

# Every 5 min: reminders, overnight queue, weekly report. Hourly at :07: the Crypto topic
[triggers]
crons = ["*/5 * * * *", "7 * * * *"]

# Private data (database_id is an id, not a secret)
[[d1_databases]]
binding = "DB"
database_name = "flipfinder"
database_id = "befd91af-75b3-4d87-832f-96174c98d4be"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, OWNER_ID, API_KEY, WEBHOOK_SECRET
